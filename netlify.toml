# Netlify Configuration File
[build]
  publish = "dist"
  command = "npm run build"

[build.environment]
  NODE_VERSION = "20"
  # Nome público do provedor; credenciais continuam sob varredura.
  SECRETS_SCAN_OMIT_KEYS = "CONTROL_STORAGE"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

# API é resolvida antes da página de entrada.
[[redirects]]
  from = "/api/control/*"
  to = "/.netlify/functions/control/:splat"
  status = 200

# Redirecionamento SPA para rota raiz
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Cabeçalhos globais de segurança
[[headers]]
  for = "/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

# Arquivos sem hash no nome: validar a versão a cada acesso (ETag/304).
[[headers]]
  for = "/public/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# Tipos MIME e cache para modelos 3D (.glb)
[[headers]]
  for = "/*.glb"
  [headers.values]
    Content-Type = "model/gltf-binary"
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/public/*.glb"
  [headers.values]
    Content-Type = "model/gltf-binary"
    Cache-Control = "public, max-age=0, must-revalidate"

# Tipos MIME e cache para CSS e JS
[[headers]]
  for = "/css/*"
  [headers.values]
    Content-Type = "text/css; charset=utf-8"
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/js/*"
  [headers.values]
    Content-Type = "application/javascript; charset=utf-8"
    Cache-Control = "public, max-age=0, must-revalidate"

# Somente arquivos cujo nome contém o hash do conteúdo podem ficar no cache permanente.
[[headers]]
  for = "/js/cache/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/css/cache/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/public/cache/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
